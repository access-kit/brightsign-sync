name: Publish Firmware

on:
  push:
    branches:
      - '**'

env:
  PROJECT_ID: access-kit
  BUCKET_NAME: access-kit-firmware

jobs:
  publish:
    name: Build and Publish Firmware
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get branch name
        id: branch
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          SAFE_BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's/\//-/g')
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "safe_name=$SAFE_BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Calculate version
        id: version
        run: |
          if [ -f "ak.version.json" ]; then
            BASE_VERSION=$(jq -r '.version // "1.0"' ak.version.json)
          else
            BASE_VERSION="1.0"
          fi
          
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION="${BASE_VERSION}.${COMMIT_COUNT}"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Calculated version: $VERSION"

      - name: Create firmware zip
        uses: TheDoctor0/zip-release@0.7.1
        with:
          filename: autorun.zip
          exclusions: |
            deploy*
            configScripts*
            *.git*
            .gitignore
            README.md
            audio.json
            config.json
            network.json
            video.json
            window.json
            manifests/*
            gha-creds-*.json

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload zip to GCS
        run: |
          BRANCH="${{ steps.branch.outputs.safe_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          PREFIX="brightsign/${BRANCH}"
          
          echo "Uploading autorun.zip to gs://${{ env.BUCKET_NAME }}/${PREFIX}/"
          
          gsutil cp autorun.zip "gs://${{ env.BUCKET_NAME }}/${PREFIX}/autorun.zip"
          gsutil cp autorun.zip "gs://${{ env.BUCKET_NAME }}/${PREFIX}/autorun-v${VERSION}.zip"
          
          echo "Uploaded firmware zip for branch ${BRANCH} at version ${VERSION}"

      - name: Upload metadata to GCS
        run: |
          BRANCH="${{ steps.branch.outputs.safe_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          COMMIT="${{ github.sha }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BUCKET="${{ env.BUCKET_NAME }}"
          PREFIX="brightsign/${BRANCH}"
          
          cat > metadata.json << EOF
          {
            "version": "${VERSION}",
            "branch": "${{ steps.branch.outputs.name }}",
            "commit": "${COMMIT}",
            "timestamp": "${TIMESTAMP}",
            "zipUrl": "https://storage.googleapis.com/${BUCKET}/${PREFIX}/autorun.zip"
          }
          EOF
          
          gsutil cp metadata.json "gs://${{ env.BUCKET_NAME }}/${PREFIX}/metadata.json"
          
          echo "Uploaded metadata:"
          cat metadata.json

      - name: Create version tag
        if: github.ref == 'refs/heads/master'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag: $TAG"
          fi

      - name: Create GitHub release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: |
            autorun.zip
            ak.features.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Development Build
          prerelease: false
          files: |
            autorun.zip
            ak.features.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
